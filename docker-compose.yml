services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: omni, POSTGRES_PASSWORD: omni, POSTGRES_DB: omniclip }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U omni"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: ./db
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    command: npx prisma migrate deploy

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [migrate, redis, minio]

  # CPU-light queue: LLM agents, YouTube API calls, scheduling
  worker-agents:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q agents,publish -c 8 -l info
    depends_on: [migrate, redis]

  # GPU-heavy queue: transcription, face tracking, FFmpeg renders
  worker-media:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q media -c 2 -l info
    depends_on: [migrate, redis, minio]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]

  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app beat -l info
    depends_on: [redis]

  web:
    build: ./frontend
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, miniodata: {} }
