# CPU by default. On an NVIDIA host:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: omni, POSTGRES_PASSWORD: omni, POSTGRES_DB: omniclip }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U omni"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  # S3-compatible object storage (MinIO no longer publishes container images).
  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    build: ./db
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    command: npx prisma migrate deploy

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  # CPU-light queue: LLM agents, YouTube API calls, scheduling
  worker-agents:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q agents,publish -c 4 -l info
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Heavy queue: transcription, face tracking, FFmpeg renders
  worker-media:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q media -c 2 -l info
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app beat -l info
    depends_on: { redis: { condition: service_healthy } }

  web:
    build:
      context: ./frontend
      args:   # NEXT_PUBLIC_* are compiled into the browser bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-change-me-internal-team-key}
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, storagedata: {} }
