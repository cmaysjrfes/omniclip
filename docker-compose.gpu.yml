# NVIDIA override: CUDA base image, NVENC encoding, Whisper large-v3 on GPU.
# Requires the NVIDIA Container Toolkit on the host.
x-gpu-build: &gpu-build
  context: ./backend
  args: { BASE_IMAGE: "nvidia/cuda:12.6.3-cudnn-runtime-ubuntu24.04" }

services:
  api: { build: *gpu-build }
  worker-agents: { build: *gpu-build }
  beat: { build: *gpu-build }
  worker-media:
    build: *gpu-build
    environment:
      FFMPEG_GPU: "true"
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL: large-v3
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]
